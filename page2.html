<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Gift</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #103156;
            color: #fce8d5;
            font-family: 'Georgia', serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* =========================
           TEXT SECTION
        ========================= */

        .content-section {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);

            width: 38%;
            padding-left: 70px;

            z-index: 10;
        }

        .content-section h1 {
            font-size: 4.2rem;
            font-weight: normal;
            line-height: 1.08;
            margin-bottom: 22px;
            color: #fbe5cf;
        }

        .content-section p {
            font-size: 1.15rem;
            margin-bottom: 35px;
            color: #d1b19a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons-container {
            display: flex;
            gap: 15px;
        }

        .btn {
            background-color: #0d335b;
            color: #fbe5cf;
            border: none;
            padding: 10px 24px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 3px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.25s ease;
            display: inline-block;
        }

        .btn:hover {
            background-color: #2c4ea2;
            transform: translateY(-2px);
        }

        /* =========================
           DOUBLE FILM
        ========================= */

        .double-film-wrapper {
            position: absolute;

            right: -5%;
            top: -40%;

            width: 75%;
            height: 200vh;

            transform: rotate(35deg);

            display: flex;
            gap: 30px;

            z-index: 2;

            overflow: hidden;
            align-items: flex-start;
        }

        /* =========================
           FILM CONTAINER
        ========================= */

        .film-container {
            background-color: #121212;

            padding: 20px 14px;

            border-left: 8px dashed #3a3a3a;
            border-right: 8px dashed #3a3a3a;

            box-shadow: -15px 15px 35px rgba(0,0,0,0.6);

            height: 100%;

            overflow: hidden;
        }

        /* الفيلم الصغير */

        .film-small {
            width: 240px;
            margin-top: 90px;
            opacity: 0.85;
        }

        /* الفيلم الكبير */

        .film-large {
            width: 360px;
        }

        /* =========================
           FILM STRIP
        ========================= */

        .film-strip {
            display: flex;
            flex-direction: column;
            gap: 22px;

            animation: scrollDown 14s linear infinite;
        }

        .film-strip-fast {
            animation: scrollDown 10s linear infinite;
        }

        /* =========================
           SMALL FILM FRAMES
        ========================= */

        .film-small .film-frame {
            width: 100%;
            height: 160px;

            background-color: #1a1a1a;

            border-radius: 4px;
            overflow: hidden;

            border: 1px solid #2a2a2a;
        }

        /* =========================
           LARGE FILM FRAMES
        ========================= */

        .film-large .film-frame {
            width: 100%;
            height: 250px;

            background-color: #1a1a1a;

            border-radius: 4px;
            overflow: hidden;

            border: 1px solid #2a2a2a;
        }

        /* =========================
           IMAGES
        ========================= */

        .film-frame img {
            width: 100%;
            height: 100%;

            object-fit: cover;
            display: block;
        }

        /* =========================
           ANIMATION
        ========================= */

        @keyframes scrollDown {

            0% {
                transform: translateY(-50%);
            }

            100% {
                transform: translateY(0%);
            }

        }


        /* ==================================================
           MOBILE
           نفس تصميم اللابتوب ولكن أصغر
        ================================================== */

        @media (max-width: 600px) {

            body {
                overflow: hidden;
            }

            /* النص بنفس مكان اللابتوب ولكن أصغر */

            .content-section {

                width: 38%;

                padding-left: 70px;

                transform:
                    translateY(-50%)
                    scale(0.48);

                transform-origin: left center;
            }


            /* الفيلمين نفس مكان اللابتوب ولكن أصغر */

            .double-film-wrapper {

                right: -5%;
                top: -40%;

                width: 75%;
                height: 200vh;

                gap: 30px;

                transform:
                    rotate(35deg)
                    scale(0.48);

                transform-origin: center center;
            }

        }


        /* ==================================================
           SMALL MOBILE
        ================================================== */

        @media (max-width: 430px) {

            .content-section {

                transform:
                    translateY(-50%)
                    scale(0.43);

                transform-origin: left center;
            }


            .double-film-wrapper {

                transform:
                    rotate(35deg)
                    scale(0.43);

                transform-origin: center center;
            }

        }


        /* ==================================================
           VERY SMALL MOBILE
        ================================================== */

        @media (max-width: 380px) {

            .content-section {

                transform:
                    translateY(-50%)
                    scale(0.39);

                transform-origin: left center;
            }


            .double-film-wrapper {

                transform:
                    rotate(35deg)
                    scale(0.39);

                transform-origin: center center;
            }

        }

    </style>
</head>
