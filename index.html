<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>omar birthday</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="passcode-wrapper">
    <div class="user-profile">
        <!-- استبدلي photo.jpg باسم صورة الألبوم لديكِ -->
        <img src="uploads/WhatsApp Image 2026-09-07 at 10.48.22 AM.jpeg" alt="User" class="profile-image">
    </div>

    <div class="passcode-container">
        <h2>Enter Passcode</h2>

        <div class="dots-container" id="dotsContainer">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
             <span class="dot"></span>

        </div>

        <p class="error-message" id="errorMessage">كلمة المرور غير صحيحة، حاول مرة أخرى</p>

        <div class="numpad">
            <button class="num-btn" data-num="1">1</button>
            <button class="num-btn" data-num="2">2</button>
            <button class="num-btn" data-num="3">3</button>
            <button class="num-btn" data-num="4">4</button>
            <button class="num-btn" data-num="5">5</button>
            <button class="num-btn" data-num="6">6</button>
            <button class="num-btn" data-num="7">7</button>
            <button class="num-btn" data-num="8">8</button>
            <button class="num-btn" data-num="9">9</button>
            <div class="empty-cell"></div>
            <button class="num-btn" data-num="0">0</button>
            <button class="action-btn" id="clearBtn">Clear</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
