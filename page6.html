        /* حاوية الصورة والسهم */
        .card-container {
            position: relative;
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        /* عرض الصورة */
        .card-container img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            display: block;
        }

        /* زر السهم للتنقل */
        .next-arrow {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            color: #0d1b2a;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            animation: bounce 2s infinite;
        }

        .next-arrow:hover {
            background-color: #ffffff;
            transform: translateX(-50%) scale(1.1);
        }

        /* حركة ترددية لطيفة للسهم للفت الانتباه */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-8px);
            }
            60% {
                transform: translateX(-50%) translateY(-4px);
            }
        }
    </style>
</head>
