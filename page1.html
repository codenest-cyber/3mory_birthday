<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OMAR BIRTHDAY</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <canvas id="matrixCanvas"></canvas>

  <script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';

    const fontSize = 18;

    let columns;
    let drops;

    function resizeCanvas() {

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      columns = Math.floor(canvas.width / fontSize);

      drops = Array(columns).fill(1);
    }

    resizeCanvas();

    window.addEventListener('resize', resizeCanvas);


    // الكلمات بالترتيب
    const sequence = [
      "3",
      "2",
      "1",
      "HAPPY",
      "BIRTHDAY",
      "TO",
      "3OMRY",
      "🎂"
    ];

    let currentIndex = 0;


    // الصفحة التالية
    const nextPageUrl = "page2.html";


    // تغيير الكلمة كل ثانيتين
    const sequenceInterval = setInterval(() => {

      currentIndex++;

      if (currentIndex >= sequence.length) {

        clearInterval(sequenceInterval);

        window.location.href = nextPageUrl;
      }

    }, 2000);


    function drawMatrix() {

      // الخلفية السوداء مع تأثير الذيل
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      // حجم خط الماتريكس
      ctx.font = fontSize + 'px monospace';


      // حروف الماتريكس
      for (let i = 0; i < drops.length; i++) {

        const text =
          characters.charAt(
            Math.floor(
              Math.random() * characters.length
            )
          );

        ctx.fillStyle = '#1a365d';

        ctx.fillText(
          text,
          i * fontSize,
          drops[i] * fontSize
        );


        // إعادة الحروف للأعلى
        if (
          drops[i] * fontSize > canvas.height &&
          Math.random() > 0.975
        ) {

          drops[i] = 0;
        }

        drops[i]++;
      }


      // الكلمة الحالية
      if (currentIndex < sequence.length) {

        const currentText =
          sequence[currentIndex];

        ctx.save();


        /*
          حساب حجم الكلام تلقائيًا
          حسب عرض شاشة الموبايل أو اللابتوب
        */

        let bigFontSize =
          Math.min(
            canvas.width / (currentText.length + 2),
            110
          );


        // حد أدنى مناسب للموبايل
        bigFontSize =
          Math.max(bigFontSize, 40);


        ctx.font =
          `bold ${bigFontSize}px sans-serif`;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';


        // التوهج
        ctx.shadowColor = '#2c4ea2';
        // ctx.shadowBlur = 30;


        // لون الكلام
        ctx.fillStyle = '#2c4ea2';


        ctx.fillText(
          currentText,
          canvas.width / 2,
          canvas.height / 2
        );


        ctx.restore();
      }
    }


    // تشغيل الحركة
    setInterval(drawMatrix, 33);

  </script>

</body>
</html>
